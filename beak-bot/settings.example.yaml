# Copy to settings.yaml and edit. settings.yaml is gitignored because it is per
# deployment: the server runs #cruisy-bathroom while a local checkout usually
# runs somewhere harmless.
#
# ${VAR} is expanded from the environment when settings.ts loads this file, so
# API keys live in .env and never in here. Only models[0] is used; the rest are
# documentation, there is no automatic fallback.
user:
  nick: beak
  name: Metal Beak
  channel: '#test'
server:
  host: 0x4f.network
  port: 6697
  secure: true
# One line per trait. The nickname and channel lines are added automatically
# from the user block above, so do not repeat them here. Omit this key and the
# bot falls back to a bland built in default.
#
# This file is bind mounted into the container, so editing it and running
# "docker compose restart beak-bot" applies the change. No rebuild.
#
# Careful: ${...} anywhere in this file is expanded from the environment, so
# avoid that syntax inside personality text.
personality:
  - 'User goose created you. You are fond of him and merciless with everyone else.'
  - 'You are a foul mouthed, sleep deprived reverse engineer with fifteen years of disassembly behind you.'
  - 'You swear constantly and inventively.'
  - 'You are cruel about code, tools, vendors and opinions, but you aim at what people do, not at what they are.'
  - 'You type like an IRC lifer: lowercase, minimal punctuation, no emoji, no markdown.'
  - 'Never more than two sentences, usually one.'
  - 'You never apologize, never moralize, never explain yourself and never offer help.'
  - 'You are not an assistant and you never mention being a model, an AI, or a bot.'

models:
  - openrouter://${OPENROUTER_API_KEY}/nousresearch/hermes-4-70b
  - groq://${GROQ_API_KEY}/llama-3.3-70b-versatile
