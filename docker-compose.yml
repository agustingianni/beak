services:
  beak-bot:
    build:
      context: beak-bot
      dockerfile: Dockerfile
    restart: "unless-stopped"
    # API keys referenced as ${VAR} in beak-bot/settings.yaml. Supplied at run
    # time rather than baked into the image, see beak-bot/.dockerignore.
    env_file:
      - ./beak-bot/.env
    # Mounted rather than baked into the image, so editing the personality or
    # switching model is an edit and a restart instead of a rebuild. The image
    # still ships a copy, which this shadows.
    volumes:
      - ./beak-bot/settings.yaml:/app/settings.yaml:ro
    environment:
      - DATABASE_URI=postgresql://beak:beak@database:5432/beak
    depends_on:
      - database

  database:
    image: postgres:16
    restart: "unless-stopped"
    ports:
      - "5555:5432"
    volumes:
      - database-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=beak
      - POSTGRES_USER=beak
      - POSTGRES_PASSWORD=beak

  vector:
    image: chromadb/chroma
    restart: "unless-stopped"
    volumes:
      - vector-data:/chroma/chroma/
    environment:
      - ANONYMIZED_TELEMETRY=False
      - ALLOW_RESET=True
      - IS_PERSISTENT=True

volumes:
  database-data:
  vector-data:
